id: easy-03-fibonacci
name: Memoized Fibonacci
tier: easy
description: |
  Write a Go package that computes Fibonacci numbers with memoization.

  Required structure:
  - Module name: example.com/fib
  - File `fib.go` exporting:
      `func Fib(n int) uint64` — returns the nth Fibonacci number
      (Fib(0)=0, Fib(1)=1, Fib(2)=1, Fib(10)=55, Fib(50)=12586269025).
      For n < 0 the function must return 0.
    Use memoization so that repeated calls share work. Concurrent
    safety is NOT required.
  - File `fib_test.go` with table-driven tests covering at least
    n = -1, 0, 1, 2, 10, 20, 50.
  - File `go.mod` declaring module example.com/fib, go 1.21.

  No external dependencies. Must build and pass `go test ./...`.

# Held-out acceptance test: run against the implementation alone (the coder
# never sees it).
hidden_test: |
  import "testing"

  func TestHiddenFib(t *testing.T) {
      cases := []struct {
          n    int
          want uint64
      }{
          {-5, 0}, {-1, 0}, {0, 0}, {1, 1}, {2, 1}, {3, 2},
          {10, 55}, {20, 6765}, {50, 12586269025}, {90, 2880067194370816120},
      }
      for _, c := range cases {
          if got := Fib(c.n); got != c.want {
              t.Fatalf("Fib(%d) = %d, want %d", c.n, got, c.want)
          }
      }
  }
