id: medium-04-csv-to-json
name: CSV-to-JSON Converter
tier: medium
description: |
  Implement a Go package that converts CSV input to a JSON array of
  objects, using the first row as field names.

  Required structure:
  - Module name: example.com/csv2json
  - File `csv2json.go` exporting:
      func Convert(r io.Reader, w io.Writer) error
    Semantics:
      - Reads CSV from r. First row is the header (column names).
      - Each subsequent row becomes a JSON object whose keys are
        header names and whose values are the cell strings.
      - Writes a JSON array (`[ {...}, {...} ]`) to w with
        deterministic key order (use the header order, not map order
        — emit by iterating headers, so unit tests can assert exact output).
      - Empty input (no header row) produces `[]`.
      - A row with fewer columns than the header is an error.
      - A row with more columns than the header is an error.
  - File `csv2json_test.go` with tests covering:
      * Two-row input -> exact expected JSON string.
      * Empty input -> "[]".
      * Row with wrong column count -> non-nil error.
    Use bytes.Buffer for r and w.
  - File `go.mod` declaring module example.com/csv2json, go 1.21.

  Standard library only (encoding/csv, encoding/json). Must build and pass `go test ./...`.
