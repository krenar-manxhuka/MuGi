id: easy-04-http-health
name: HTTP Health Endpoint
tier: easy
description: |
  Build a Go package that exposes a minimal HTTP health endpoint.

  Required structure:
  - Module name: example.com/health
  - File `health.go` exporting `func Handler() http.Handler`. The
    handler responds to GET /health with:
      HTTP 200
      Header Content-Type: application/json
      Body: {"status":"ok"}
    Any non-GET method must return 405 Method Not Allowed.
  - File `health_test.go` using `net/http/httptest` with tests for:
      GET /health -> 200, correct content-type, body equals {"status":"ok"}
      POST /health -> 405
  - File `go.mod` declaring module example.com/health, go 1.21.

  No external dependencies. Must build and pass `go test ./...`.
