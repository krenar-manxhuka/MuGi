id: hard-03-expr-eval
name: Arithmetic Expression Evaluator
tier: hard
description: |
  Implement a Go package that evaluates arithmetic expressions over
  float64 using the shunting-yard algorithm (or a recursive-descent
  parser — either is fine).

  Required structure:
  - Module name: example.com/expr
  - File `expr.go` exporting:
      func Eval(expression string) (float64, error)
    Supported syntax:
      - Decimal numbers: 1, 1.5, .5, 2e3
      - Binary operators: + - * /  with standard precedence
        (* and / bind tighter than + and -) and left-associativity.
      - Parentheses for grouping.
      - Unary minus: -3, -(2+1)
      - Arbitrary whitespace between tokens.
    Error cases (must return a non-nil error):
      - Empty input.
      - Mismatched parentheses.
      - Unknown character.
      - Division by zero.
      - Trailing operator / two operators in a row (e.g., "1 + + 2").
  - File `expr_test.go` with table-driven tests covering at least:
      * "1+2"           -> 3
      * "2*3+4"         -> 10
      * "2+3*4"         -> 14
      * "(2+3)*4"       -> 20
      * "-3 + 2"        -> -1
      * "2 * (3 + (4 - 1)) / 3"  -> 4
      * "1.5 + 2.5"     -> 4.0
      * ""              -> error
      * "1+"            -> error
      * "1/0"           -> error
      * "(1+2"          -> error
      * "1 @ 2"         -> error
    Use approximate float comparison with a small tolerance.
  - File `go.mod` declaring module example.com/expr, go 1.21.

  Standard library only. Must build and pass `go test ./...`.
