id: medium-05-url-shortener
name: In-Memory URL Shortener
tier: medium
description: |
  Implement a Go package that provides an in-memory URL shortener.

  Required structure:
  - Module name: example.com/shorten
  - File `shorten.go` exporting:
      type Store struct { /* unexported */ }
      func NewStore() *Store
      func (s *Store) Shorten(longURL string) (code string, err error)
      func (s *Store) Resolve(code string) (longURL string, ok bool)
    Semantics:
      - Shorten returns a 6-character base62 code [0-9A-Za-z].
      - The same long URL passed twice must return the SAME code
        (idempotent). Different URLs get different codes.
      - Resolve returns the original URL and true on hit; "", false
        on miss.
      - Shorten returns a non-nil error on empty input.
      - Safe for concurrent use.
  - File `shorten_test.go` with tests covering:
      * Round-trip: Shorten then Resolve returns the original.
      * Idempotency: Shorten(same URL) twice returns the same code.
      * Distinctness: Shorten of two different URLs returns two
        different codes.
      * Resolve("missing") returns "", false.
      * Shorten("") returns a non-nil error.
      * 100 concurrent Shorten calls on distinct URLs all succeed
        and all codes round-trip.
  - File `go.mod` declaring module example.com/shorten, go 1.21.

  Standard library only. Must build and pass `go test ./...`.

# Held-out acceptance test: run against the implementation alone (the coder
# never sees it).
hidden_test: |
  import (
      "regexp"
      "sync"
      "testing"
  )

  func TestHiddenShorten(t *testing.T) {
      s := NewStore()
      code, err := s.Shorten("https://example.com/a")
      if err != nil {
          t.Fatalf("Shorten error: %v", err)
      }
      if !regexp.MustCompile(`^[0-9A-Za-z]{6}$`).MatchString(code) {
          t.Fatalf("code %q is not a 6-char base62 string", code)
      }
      if got, ok := s.Resolve(code); !ok || got != "https://example.com/a" {
          t.Fatalf("Resolve(%q) = %q,%v", code, got, ok)
      }
      if code2, _ := s.Shorten("https://example.com/a"); code2 != code {
          t.Fatalf("not idempotent: %q vs %q", code, code2)
      }
      if other, _ := s.Shorten("https://example.com/b"); other == code {
          t.Fatal("distinct URLs returned the same code")
      }
      if _, ok := s.Resolve("missing"); ok {
          t.Fatal("Resolve(missing) should return false")
      }
      if _, err := s.Shorten(""); err == nil {
          t.Fatal("Shorten(\"\") should return a non-nil error")
      }
      // Concurrency: distinct URLs all succeed and round-trip.
      const n = 50
      urls := make([]string, n)
      codes := make([]string, n)
      for i := 0; i < n; i++ {
          urls[i] = "https://c.example/" + string(rune('A'+i%26)) + "-" + string(rune('a'+i))
      }
      var wg sync.WaitGroup
      for i := 0; i < n; i++ {
          wg.Add(1)
          go func(i int) {
              defer wg.Done()
              if c, err := s.Shorten(urls[i]); err == nil {
                  codes[i] = c
              }
          }(i)
      }
      wg.Wait()
      for i := 0; i < n; i++ {
          if codes[i] == "" {
              t.Fatalf("concurrent Shorten %d failed", i)
          }
          if got, ok := s.Resolve(codes[i]); !ok || got != urls[i] {
              t.Fatalf("concurrent round-trip %d = %q,%v want %q", i, got, ok, urls[i])
          }
      }
  }
